controller_manager: #program utama ros yg mengatur semua hal 
  ros__parameters: 
    update_rate: 50 #mengatur seberapa cepat servo ditulis (satuan Hz)

    joint_state_broadcaster: #mengirimkan sudut ke servo, membaca posisi saat ini 
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller: #cuma nama, bebas, tipenya position controller 
      type: position_controllers/JointGroupPositionController

  
arm_controller: 
  ros__parameters: 
    joints: 
      - joint_1
      - joint_2 
      - joint_3

